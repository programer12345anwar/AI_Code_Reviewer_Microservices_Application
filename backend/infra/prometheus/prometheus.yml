global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api-gateway'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080'] 

  - job_name: 'auth-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:8081']

  - job_name: 'review-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['review-service:8082']

  - job_name: 'worker-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['worker-service:8083']

  - job_name: 'llm-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['llm-service:8084']

  - job_name: 'github-integration-service'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['github-integration-service:8085']
