server:
  port: 8082

spring:
  application:
    name: review-service
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aicodereviewer}"
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    table: flyway_schema_history_review
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}"

clients:
  github-integration:
    base-url: "${GITHUB_SERVICE_URL:http://localhost:8085}"
  llm:
    base-url: "${LLM_SERVICE_URL:http://localhost:8084}"
  internal:
    api-key: ${INTERNAL_API_KEY:internal-dev-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.aicodereviewer.review: INFO
