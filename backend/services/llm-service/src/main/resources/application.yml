server:
  port: 8084

spring:
  application:
    name: llm-service

providers:
  openai:
    enabled: ${OPENAI_ENABLED:true}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
  gemini:
    enabled: ${GEMINI_ENABLED:true}
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-1.5-pro}

clients:
  internal:
    api-key: ${INTERNAL_API_KEY:internal-dev-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.aicodereviewer.llm: INFO
